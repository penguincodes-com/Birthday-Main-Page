<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Cutie !</title>
    <!-- Preconnect for faster Google Fonts loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Animated Background Elements -->
    <div class="bg-container">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
        <div id="particle-container"></div>
    </div>

    <main>
        <!-- Hero Section -->
        <section class="hero">
            <div class="glass-card hero-card" id="hero-card">
                <p class="intro-text">A LITTLE SOMETHING JUST FOR YOU 😋✨</p>
                <h1 class="main-heading" id="display-name">Happiest Birthday!</h1>
                <p class="supporting-text">Some people make ordinary days feel a little more special.<br>Today is all about celebrating you.</p>
                
                <div class="button-wrapper">
                    <a href="#" id="magic-button" class="glass-button" target="_blank" rel="noopener noreferrer">CLICK HERE ✨</a>
                </div>
            </div><br><br><br><br>
            <div class="glass-badge">I Love You❤️</div>
        </section>

        <!-- Personal Message Section -->
        <section class="message-section" id="message-section">
            <div class="glass-card message-card" id="message-card">
                <h2 class="message-heading">A LITTLE NOTE FOR YOU 💗</h2>
                <div class="divider"></div>
                <p id="display-message" class="personal-message">
                    <!-- Message will be inserted by JavaScript -->
                </p>
            </div>
        </section>
    </main>

    <footer>
        A little birthday surprise, made with love ♡
    </footer>

    <script src="script.js"></script>
</body>
</html>
